name: Pages

# Publishes docs/ (the public form files) as this repo's own GitHub Pages site.
# Live at https://form.calmcampus.app/ (custom domain set in Settings > Pages; docs/CNAME documents it,
# GitHub ignores it for Actions deploys). The calmweb-forms Worker answers /api/*, /f/*, /forms/* and
# /tokens.css on that host and passes the static files through to this site. Old links on
# cc.braunf.com/f/<slug> keep being served from CalmWeb's copies plus the same Worker.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Links resolve and nothing loads from third parties
        run: python3 scripts/check-site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
